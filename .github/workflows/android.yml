name: Build VoltGuard APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Assemble signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create fresh release keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/voltguard-release.jks \
            -alias voltguard -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass voltguard123 -keypass voltguard123 \
            -dname "CN=VoltGuard, OU=CI, O=VoltGuard, L=Jakarta, C=ID"
          ls -la keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect output
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          [ -n "$APK" ] || { echo "No release APK produced"; exit 1; }
          cp "$APK" dist/VoltGuard-release.apk
          sha256sum dist/VoltGuard-release.apk > dist/VoltGuard-release.apk.sha256
          echo "=== APK ==="; ls -lh dist

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltGuard-release
          path: |
            dist/VoltGuard-release.apk
            dist/VoltGuard-release.apk.sha256
          if-no-files-found: error
